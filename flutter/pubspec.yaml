name: nicaragua_plate
description: "Nicaragua's licence plates for the plate_core library — the 2005 series for Managua and the departments, with its theme, alphabets and advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/nicaragua_plate/tree/main/flutter
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No assets. The map watermark and the coat-of-arms seal are not drawn.
